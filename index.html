<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Control y Distribución de Cajones</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 10px; background-color: #f4f6f9; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1, h2, h3 { text-align: center; color: #222; margin-top: 0; }
        .product-group { margin-bottom: 20px; }
        .product-group h3 { background: #333; color: white; padding: 8px; border-radius: 6px; font-size: 1rem; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #ddd; }
        .item-name { flex: 2; font-size: 0.85rem; font-weight: bold; color: #444; }
        .inputs { flex: 1; display: flex; gap: 5px; }
        input[type="number"] { width: 40px; padding: 6px; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        
        button { width: 100%; padding: 15px; background-color: #28a745; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; margin-top: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.2s; }
        button:disabled { background-color: #999; cursor: not-allowed; }
        button.btn-secundario { background-color: #007bff; margin-top: 15px; }
        button.btn-peligro { background-color: #dc3545; margin-top: 10px; }
        button.btn-importar { background-color: #007bff; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        button.btn-config { background-color: transparent; color: #666; border: 1px solid #ccc; font-size: 0.8rem; padding: 8px; box-shadow: none; margin-top: 20px;}

        .grid-container { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .nevera { background: #f8f9fa; border: 2px solid #adb5bd; border-radius: 6px; display: flex; flex-direction: column-reverse; padding: 5px; height: 380px; overflow-y: auto; }
        .nevera-title { text-align: center; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; background: #e9ecef; border-radius: 4px; padding: 4px;}
        
        .cajon { color: white; text-align: center; margin: 2px 0; padding: 5px 2px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; border: 1px solid rgba(0,0,0,0.2); text-shadow: 1px 1px 2px rgba(0,0,0,0.8); box-shadow: 0 1px 2px rgba(0,0,0,0.2); }
        .cajon.text-dark { color: #222 !important; text-shadow: none !important; border: 1px solid rgba(0,0,0,0.3); }
        .cajon.excedente { border: 2px solid #dc3545; box-shadow: 0 0 5px #dc3545; }
        .cajon.espacio { background: transparent !important; border: 2px dashed #999; color: #666 !important; font-style: italic; text-shadow: none !important; box-shadow: none; }

        /* 🔴 ANIMACIÓN DE ALERTA PARA CAJONES A FORRAR */
        @keyframes titilarAlerta {
            0% { box-shadow: 0 0 4px #fff inset, 0 0 5px rgba(255, 152, 0, 0.4); border-color: rgba(255,255,255,0.5); }
            50% { box-shadow: 0 0 10px #fff inset, 0 0 15px rgba(255, 87, 34, 0.9); border-color: #fff; }
            100% { box-shadow: 0 0 4px #fff inset, 0 0 5px rgba(255, 152, 0, 0.4); border-color: rgba(255,255,255,0.5); }
        }
        .cajon.forrar { border: 2px dashed #fff; font-style: italic; animation: titilarAlerta 1.5s infinite; position: relative; z-index: 10;}

        /* Paleta de Colores */
        .bg-cs { background-color: #B27043; } .bg-cc { background-color: #5C4033; } .bg-cp { background-color: #FA8072; } .bg-criolla { background-color: #C04000; } .bg-bondiola { background-color: #4A0E4E; }
        .bg-pollo { background-color: #FDFD96; } .bg-curry { background-color: #FF8C00; }
        .bg-jq { background-color: #FFB6C1; } .bg-cheeseburger { background-color: #D2691E; } .bg-roquefort { background-color: #87CEEB; } .bg-cebolla { background-color: #F5F5DC; } .bg-caprese { background-color: #FF6347; }
        .bg-verdura { background-color: #2E8B57; } .bg-humita { background-color: #FFD700; } .bg-choclo { background-color: #FFA07A; } .bg-puerro { background-color: #A9A9A9; }
        .bg-burrito-ternera { background-color: #8B6508; } .bg-burrito-bondiola { background-color: #800000; } .bg-burrito-pollo { background-color: #DAA520; } .bg-burrito-veggie { background-color: #32CD32; }
        .bg-default { background-color: #555; }
    </style>
</head>
<body>

<div class="container" id="input-section">
    <h1>Control de Stock</h1>
    
    <input type="file" id="fotoRemitoIA" accept="image/*" capture="environment" style="display:none;" onchange="procesarRemitoIA()">
    <button id="btn-ia" class="btn-importar" onclick="document.getElementById('fotoRemitoIA').click()">📸 Escanear Remito con IA</button>
    
    <div class="product-group">
        <h3>Jamón y Queso (Prioridad N1)</h3>
        <div class="item-row">
            <span class="item-name">Jamón y Queso (JQ)</span>
            <div class="inputs"><input type="number" id="st-JQ" placeholder="Hay"><input type="number" id="pe-JQ" placeholder="Llegan"></div>
        </div>
    </div>
    
    <div class="product-group"><h3>Carnes y Clásicas (N2 y N3)</h3><div id="clasicas-list"></div></div>
    
    <div class="product-group" style="background:#e3f2fd; padding:10px; border-radius:8px;">
        <h3 style="background:#1976d2;">Congelador: Lado Izquierdo</h3>
        <div id="cong-izq-list"></div>
    </div>
    <div class="product-group" style="background:#e3f2fd; padding:10px; border-radius:8px;">
        <h3 style="background:#1976d2;">Congelador: Lado Derecho</h3>
        <div id="cong-der-list"></div>
    </div>

    <button onclick="ejecutarYGuardar()">Calcular Distribución</button>
    <button class="btn-peligro" onclick="limpiarTodo()" style="background: transparent; color: #dc3545; border: 1px solid #dc3545; box-shadow: none;">🗑️ Borrar todos los datos y empezar de cero</button>
    <button class="btn-config" onclick="borrarLlave()">⚙️ Cambiar API Key de Gemini</button>
</div>

<div class="container grid-container" id="output-section">
    <div><div class="nevera-title">Nevera 1 (Max 11)</div><div class="nevera" id="nevera1"></div></div>
    <div><div class="nevera-title">Nevera 2 (Max 18)</div><div class="nevera" id="nevera2"></div></div>
    
    <div style="grid-column: span 2;">
        <div class="nevera-title">Nevera 3 (Max 20)</div>
        <div class="nevera" id="nevera3" style="height: auto; min-height: 200px;"></div>
    </div>
    
    <div style="grid-column: span 2; background: rgba(33, 150, 243, 0.1); padding: 5px; border-radius: 8px;">
        <div class="nevera-title" style="color: #0d47a1;">Congelador (Izquierda 12 | Derecha 12)</div>
        <div style="display: flex; gap: 10px;">
            <div class="nevera" id="cong-izq" style="flex: 1; height: 350px;"></div>
            <div class="nevera" id="cong-der" style="flex: 1; height: 350px;"></div>
        </div>
    </div>
    
    <button class="btn-secundario" onclick="volverAEditar()" style="grid-column: span 2;">✏️ Volver a Editar Datos</button>
</div>

<script>
    // --- 1. CONFIGURACIÓN DE LISTAS (ORDEN ESTRICTO PARA EL CONGELADOR) ---
    const clasicas = ['Bondiola', 'Capresse', 'Carne Cuchillo', 'Carne Picante', 'Carne Suave', 'Cheeseburger', 'Humita', 'Pollo', 'Roquefort c/ Jamón'];
    // Orden exacto de arriba hacia abajo
    const congIzqArr = ['Pollo Curry Veg.', 'Carne Criolla Veg.', 'Choclo y Calabaza', 'Puerro y Hongos'];
    const congDerArr = ['Cebolla y Queso', 'Verdura', 'Burrito Ternera', 'Burrito Pollo', 'Burrito Cerdo', 'Burrito Veg.'];

    function generarInputs(array, containerId, prefix) {
        const container = document.getElementById(containerId);
        array.forEach((item, index) => {
            container.innerHTML += `
                <div class="item-row">
                    <span class="item-name">${item}</span>
                    <div class="inputs">
                        <input type="number" id="st-${prefix}${index}" placeholder="Hay">
                        <input type="number" id="pe-${prefix}${index}" placeholder="Llegan">
                    </div>
                </div>`;
        });
    }

    generarInputs(clasicas, 'clasicas-list', 'cl');
    generarInputs(congIzqArr, 'cong-izq-list', 'ci');
    generarInputs(congDerArr, 'cong-der-list', 'cd');

    // --- RECUPERAR MEMORIA AL CARGAR LA PÁGINA ---
    window.onload = function() {
        let guardado = localStorage.getItem('estadoDistribucion');
        if (guardado) {
            let datos = JSON.parse(guardado);
            for (let id in datos) {
                if (document.getElementById(id)) document.getElementById(id).value = datos[id];
            }
        }
        if (localStorage.getItem('vistaActiva') === 'output') {
            calcularDistribucion();
        }
    };

    function ejecutarYGuardar() {
        let datos = {};
        document.querySelectorAll('input[type="number"]').forEach(inp => datos[inp.id] = inp.value);
        localStorage.setItem('estadoDistribucion', JSON.stringify(datos));
        localStorage.setItem('vistaActiva', 'output');
        calcularDistribucion();
    }

    function volverAEditar() {
        document.getElementById('input-section').style.display = 'block';
        document.getElementById('output-section').style.display = 'none';
        localStorage.setItem('vistaActiva', 'input');
    }

    function limpiarTodo() {
        if(confirm("¿Seguro que quieres borrar todos los números y empezar de cero?")) {
            localStorage.removeItem('estadoDistribucion');
            localStorage.removeItem('vistaActiva');
            location.reload();
        }
    }

    function getColorClass(itemName) {
        const name = itemName.toUpperCase();
        if (name.includes("SUAVE")) return "bg-cs";
        if (name.includes("CUCHILLO")) return "bg-cc";
        if (name.includes("PICANTE")) return "bg-cp";
        if (name.includes("CRIOLLA")) return "bg-criolla";
        if (name.includes("BONDIOLA") && !name.includes("BURRITO")) return "bg-bondiola";
        if (name.includes("POLLO") && !name.includes("CURRY") && !name.includes("BURRITO")) return "bg-pollo text-dark";
        if (name.includes("CURRY")) return "bg-curry";
        if (name.includes("JAMÓN Y QUESO") || name.includes("JAMON Y QUESO") || name === "JQ") return "bg-jq text-dark";
        if (name.includes("CHEESEBURGER") || name.includes("CHEESE BURGER")) return "bg-cheeseburger";
        if (name.includes("ROQUEFORT")) return "bg-roquefort text-dark";
        if (name.includes("CEBOLLA")) return "bg-cebolla text-dark";
        if (name.includes("CAPRESSE") || name.includes("CAPRESE")) return "bg-caprese";
        if (name.includes("VERDURA") && !name.includes("BURRITO")) return "bg-verdura";
        if (name.includes("HUMITA")) return "bg-humita text-dark";
        if (name.includes("CHOCLO") || name.includes("CALABAZA")) return "bg-choclo text-dark";
        if (name.includes("PUERRO") || name.includes("HONGOS")) return "bg-puerro";
        if (name.includes("BURRITO") && name.includes("TERNERA")) return "bg-burrito-ternera";
        if (name.includes("BURRITO") && (name.includes("BONDIOLA") || name.includes("CERDO"))) return "bg-burrito-bondiola";
        if (name.includes("BURRITO") && name.includes("POLLO")) return "bg-burrito-pollo text-dark";
        if (name.includes("BURRITO") && (name.includes("VEG") || name.includes("VEGGIE"))) return "bg-burrito-veggie text-dark";
        return "bg-default";
    }

    async function procesarRemitoIA() {
        let apiKey = localStorage.getItem('geminiApiKey');
        if (!apiKey) {
            apiKey = prompt("Por favor, ingresa tu API Key de Gemini. Solo se pedirá esta vez:");
            if (!apiKey) return;
            localStorage.setItem('geminiApiKey', apiKey);
        }

        const fileInput = document.getElementById('fotoRemitoIA');
        if (fileInput.files.length === 0) return;
        const btn = document.getElementById('btn-ia');
        const originalText = btn.innerHTML;
        btn.innerHTML = "⏳ La IA está calculando..."; btn.disabled = true;

        const file = fileInput.files[0];
        const reader = new FileReader();
        reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];
            const promptText = `Analiza este remito. Calcula la cantidad de cajones dividiendo las empanadas entre 30 y los burritos entre 14. Devuelve ÚNICAMENTE un objeto JSON válido donde las claves sean el nombre del producto en MAYÚSCULAS y los valores sean los números finales. Ejemplo: {"JAMON Y QUESO": 5}. No incluyas texto adicional.`;
            const payload = { contents: [{ parts: [{ text: promptText }, { inline_data: { mime_type: file.type, data: base64Image } }] }] };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (response.ok && data.candidates) {
                    let textoIA = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                    try {
                        inyectarDatos(JSON.parse(textoIA));
                        ejecutarYGuardar(); // Auto-guardamos lo que escanea la IA
                        btn.innerHTML = "✅ ¡Datos Inyectados!"; btn.style.backgroundColor = "#28a745";
                    } catch (e) { alert("Error al interpretar los datos."); btn.innerHTML = originalText; }
                } else {
                    if(data.error && data.error.code === 400) alert("API Key inválida."); else alert("Error de la IA.");
                    btn.innerHTML = originalText;
                }
            } catch (error) { alert("Error de conexión."); btn.innerHTML = originalText; }
            setTimeout(() => { btn.innerHTML = originalText; btn.disabled = false; btn.style.backgroundColor = "#007bff"; }, 3000);
        }
        reader.readAsDataURL(file);
    }

    function inyectarDatos(datos) {
        document.querySelectorAll('input[id^="pe-"]').forEach(input => input.value = "");
        for (const [producto, cantidad] of Object.entries(datos)) {
            let cant = Math.ceil(parseFloat(cantidad));
            if(cant <= 0) continue;
            let idDestino = null, p = producto.toUpperCase();

            if (p.includes("JAMON") && p.includes("QUESO") && !p.includes("ROQUEFORT")) idDestino = "pe-JQ";
            else if (p.includes("BONDIOLA")) idDestino = "pe-cl0";
            else if (p.includes("CAPRESSE")) idDestino = "pe-cl1";
            else if (p.includes("CUCHILLO")) idDestino = "pe-cl2";
            else if (p.includes("PICANTE")) idDestino = "pe-cl3";
            else if (p.includes("SUAVE")) idDestino = "pe-cl4";
            else if (p.includes("CHEESEBURGER")) idDestino = "pe-cl5";
            else if (p.includes("HUMITA")) idDestino = "pe-cl6";
            else if (p.includes("POLLO") && !p.includes("CURRY") && !p.includes("BURRITO")) idDestino = "pe-cl7";
            else if (p.includes("ROQUEFORT")) idDestino = "pe-cl8";
            // Nuevos índices basados en el orden estricto
            else if (p.includes("CURRY")) idDestino = "pe-ci0";
            else if (p.includes("CRIOLLA")) idDestino = "pe-ci1";
            else if (p.includes("CHOCLO") || p.includes("CALABAZA")) idDestino = "pe-ci2";
            else if (p.includes("PUERRO") || p.includes("HONGOS")) idDestino = "pe-ci3";
            
            else if (p.includes("CEBOLLA") && !p.includes("BURRITO")) idDestino = "pe-cd0";
            else if (p.includes("VERDURA") && !p.includes("BURRITO")) idDestino = "pe-cd1";
            else if (p.includes("BURRITO") && p.includes("TERNERA")) idDestino = "pe-cd2";
            else if (p.includes("BURRITO") && p.includes("POLLO")) idDestino = "pe-cd3";
            else if (p.includes("BURRITO") && (p.includes("CERDO") || p.includes("BONDIOLA"))) idDestino = "pe-cd4";
            else if (p.includes("BURRITO") && (p.includes("VEG") || p.includes("VEGGIE"))) idDestino = "pe-cd5";

            if (idDestino) {
                let actual = parseInt(document.getElementById(idDestino).value) || 0;
                document.getElementById(idDestino).value = actual + cant;
            }
        }
    }

    function getVal(id) { return (parseInt(document.getElementById(id).value) || 0); }
    function borrarLlave() { localStorage.removeItem('geminiApiKey'); alert("Llave borrada."); }

    function calcularDistribucion() {
        document.getElementById('input-section').style.display = 'none';
        document.getElementById('output-section').style.display = 'grid';

        let maxIzq = 12, maxDer = 12;
        let arrIzqExc = [], arrIzqNat = [];
        let arrDerExc = [], arrDerNat = [];
        let poolN2N3 = [];

        // 1. Calcular Nativas de Congelador y recopilar excedentes a Forrar
        congIzqArr.forEach((item, i) => {
            let hay = getVal(`st-ci${i}`), llegan = getVal(`pe-ci${i}`);
            let colorClase = getColorClass(item);
            for(let j=0; j<hay; j++) { if(maxIzq > 0) { arrIzqNat.unshift(`<div class="cajon ${colorClase}">${item}</div>`); maxIzq--; } }
            if(llegan > 0) poolN2N3.push({ name: `${item} (A Forrar)`, qty: llegan, baseName: item, isJQ: false, canFreeze: false, isForrar: true });
        });

        congDerArr.forEach((item, i) => {
            let hay = getVal(`st-cd${i}`), llegan = getVal(`pe-cd${i}`);
            let colorClase = getColorClass(item);
            if(item.includes('Burrito')) {
                let total = hay + llegan;
                for(let j=0; j<total; j++) { if(maxDer > 0) { arrDerNat.unshift(`<div class="cajon ${colorClase}">${item}</div>`); maxDer--; } }
            } else {
                for(let j=0; j<hay; j++) { if(maxDer > 0) { arrDerNat.unshift(`<div class="cajon ${colorClase}">${item}</div>`); maxDer--; } }
                if(llegan > 0) poolN2N3.push({ name: `${item} (A Forrar)`, qty: llegan, baseName: item, isJQ: false, canFreeze: false, isForrar: true });
            }
        });

        // 2. Lógica Excedentes JQ y Clásicas hacia Congelador
        let totalJQ = getVal('st-JQ') + getVal('pe-JQ');
        let maxN1 = 11;
        let jqParaN1 = Math.min(totalJQ, maxN1);
        let jqExcedente = totalJQ > maxN1 ? totalJQ - maxN1 : 0;
        let colorJQ = getColorClass("JAMÓN Y QUESO");
        
        while(jqExcedente > 0 && (maxIzq > 0 || maxDer > 0)) {
            if (maxIzq > 0) { arrIzqExc.push(`<div class="cajon ${colorJQ} excedente">Jamón y Queso (Exc)</div>`); maxIzq--; }
            else if (maxDer > 0) { arrDerExc.push(`<div class="cajon ${colorJQ} excedente">Jamón y Queso (Exc)</div>`); maxDer--; }
            jqExcedente--;
        }
        if (jqExcedente > 0) poolN2N3.push({ name: 'Jamón y Queso', qty: jqExcedente, baseName: 'Jamón y Queso', isJQ: true, canFreeze: true, isForrar: false });

        clasicas.forEach((item, i) => {
            let total = getVal(`st-cl${i}`) + getVal(`pe-cl${i}`);
            let colorClase = getColorClass(item);
            if(total > 0) {
                let paraNevera = total;
                if (total > 6) {
                    let exceso = total - 6, congeladosExitosos = 0;
                    while(exceso > 0 && (maxIzq > 0 || maxDer > 0)) {
                        if (maxIzq > 0) { arrIzqExc.push(`<div class="cajon ${colorClase} excedente">${item} (Exc)</div>`); maxIzq--; }
                        else if (maxDer > 0) { arrDerExc.push(`<div class="cajon ${colorClase} excedente">${item} (Exc)</div>`); maxDer--; }
                        exceso--; congeladosExitosos++;
                    }
                    paraNevera = total - congeladosExitosos; 
                }
                poolN2N3.push({ name: item, qty: paraNevera, baseName: item, isJQ: false, canFreeze: true, isForrar: false });
            }
        });

        // Desbordamiento General N2/N3 hacia Congelador
        poolN2N3.sort((a, b) => b.qty - a.qty);
        let excedenteGeneral = poolN2N3.reduce((acc, item) => acc + item.qty, 0) - 38;
        
        if (excedenteGeneral > 0) {
            for (let item of poolN2N3) {
                if (excedenteGeneral <= 0 || (maxIzq + maxDer) <= 0) break;
                if (item.canFreeze === false) continue; // Intocables (A Forrar)
                let aCongelar = Math.min(item.qty - 2, excedenteGeneral, (maxIzq + maxDer));
                let colorClase = getColorClass(item.baseName);
                if (aCongelar > 0) {
                    item.qty -= aCongelar; excedenteGeneral -= aCongelar;
                    for(let i=0; i<aCongelar; i++) {
                        if (maxIzq > 0) { arrIzqExc.push(`<div class="cajon ${colorClase} excedente">${item.name} (Exc)</div>`); maxIzq--; }
                        else if (maxDer > 0) { arrDerExc.push(`<div class="cajon ${colorClase} excedente">${item.name} (Exc)</div>`); maxDer--; }
                    }
                }
            }
        }

        // 3. Renderizar Congeladores (Excedentes al fondo, Nativas arriba)
        document.getElementById('cong-izq').innerHTML = arrIzqExc.join('') + arrIzqNat.join('');
        document.getElementById('cong-der').innerHTML = arrDerExc.join('') + arrDerNat.join('');

        // 4. Renderizar Neveras
        let cN1 = [];
        for(let i=0; i<jqParaN1; i++) { cN1.push(`<div class="cajon ${colorJQ}">Jamón y Queso</div>`); }

        // Agrupar los "A Forrar" juntos al inicio para que queden al fondo de las neveras
        poolN2N3 = poolN2N3.filter(i => i.qty > 0).sort((a, b) => {
            if (a.isForrar && !b.isForrar) return -1;
            if (!a.isForrar && b.isForrar) return 1;
            return b.qty - a.qty;
        });

        let maxN2 = 18, maxN3 = 20, cN2 = [], cN3 = [];
        let countN2 = 0, countN3 = 0;
        let permiteEspacios = (poolN2N3.reduce((acc, item) => acc + item.qty, 0) + poolN2N3.length) <= (maxN2 + maxN3);

        poolN2N3.forEach(item => {
            let remainingToPlace = item.qty;
            while (remainingToPlace > 0) {
                let chooseN2 = false;
                if (countN2 < maxN2 && countN3 < maxN3) chooseN2 = countN2 <= countN3; 
                else if (countN2 < maxN2) chooseN2 = true;
                else if (countN3 < maxN3) chooseN2 = false;
                else break;

                let arrayDestino = chooseN2 ? cN2 : cN3;
                let cantidadAColocar = Math.min(remainingToPlace, chooseN2 ? (maxN2 - countN2) : (maxN3 - countN3));
                let colorClase = getColorClass(item.baseName);
                
                for(let i=0; i<cantidadAColocar; i++) {
                    let clase = `cajon ${colorClase}`;
                    if (item.isForrar) clase += " forrar";
                    arrayDestino.push(`<div class="${clase}">${item.name}</div>`);
                    if (chooseN2) countN2++; else countN3++;
                }
                remainingToPlace -= cantidadAColocar;
                
                // No meter espacios si son las de "A forrar" para mantenerlas agrupadas visualmente
                if (remainingToPlace === 0 && permiteEspacios && !item.isForrar) {
                    if (chooseN2 && countN2 < maxN2) { arrayDestino.push(`<div class="cajon espacio">--- Espacio Libre ---</div>`); countN2++; }
                    else if (!chooseN2 && countN3 < maxN3) { arrayDestino.push(`<div class="cajon espacio">--- Espacio Libre ---</div>`); countN3++; }
                }
            }
        });

        document.getElementById('nevera1').innerHTML = cN1.join('');
        document.getElementById('nevera2').innerHTML = cN2.join('');
        document.getElementById('nevera3').innerHTML = cN3.join('');
    }
</script>
</body>
</html>
