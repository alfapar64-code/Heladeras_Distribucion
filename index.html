<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Distribución de Cajones</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; padding: 10px; 
            background-color: #f4f6f9; /* Fondo liso más limpio */
        }
        .container { 
            max-width: 600px; margin: 0 auto; 
            background: white; 
            padding: 15px; border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        h1, h2, h3 { text-align: center; color: #222; margin-top: 0; }
        .product-group { margin-bottom: 20px; }
        .product-group h3 { background: #333; color: white; padding: 8px; border-radius: 6px; font-size: 1rem; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid #ddd; }
        .item-name { flex: 2; font-size: 0.85rem; font-weight: bold; color: #444; }
        .inputs { flex: 1; display: flex; gap: 5px; }
        input[type="number"] { width: 40px; padding: 6px; text-align: center; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
        
        button { 
            width: 100%; padding: 15px; background-color: #28a745; color: white; 
            border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; 
            margin-top: 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        button:disabled { background-color: #999; cursor: not-allowed; }
        button.btn-secundario { background-color: #6c757d; margin-top: 15px; }
        button.btn-importar { background-color: #007bff; margin-bottom: 15px; display: flex; justify-content: center; align-items: center; gap: 8px;}
        button.btn-config { background-color: transparent; color: #666; border: 1px solid #ccc; font-size: 0.8rem; padding: 8px; box-shadow: none; margin-top: 20px;}

        .grid-container { display: none; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .nevera { 
            background: #f8f9fa; border: 2px solid #adb5bd; 
            border-radius: 6px; display: flex; flex-direction: column-reverse; 
            padding: 5px; height: 380px; overflow-y: auto; 
        }
        .nevera-title { text-align: center; font-weight: bold; font-size: 0.85rem; margin-bottom: 5px; background: #e9ecef; border-radius: 4px; padding: 4px;}
        
        .cajon { background: #ff9800; color: white; text-align: center; margin: 1px 0; padding: 4px; border-radius: 3px; font-size: 0.75rem; font-weight: bold; border: 1px solid #e65100;}
        .cajon.delicado { background: #2196f3; border-color: #0b7dda; }
        .cajon.jq { background: #e91e63; border-color: #c2185b; }
        .cajon.espacio { background: transparent; border: 2px dashed #999; color: #666; font-style: italic; }
        .cajon.excedente { background: #9c27b0; border-color: #7b1fa2; }
        .cajon.forrar { background: #e65100; border: 2px solid #fff; color: white; box-shadow: 0 0 5px rgba(0,0,0,0.5); font-style: italic;}
    </style>
</head>
<body>

<div class="container" id="input-section">
    <h1>Control de Stock</h1>
    
    <!-- Input oculto para abrir la cámara -->
    <input type="file" id="fotoRemitoIA" accept="image/*" capture="environment" style="display:none;" onchange="procesarRemitoIA()">
    
    <!-- Botón que activa la cámara -->
    <button id="btn-ia" class="btn-importar" onclick="document.getElementById('fotoRemitoIA').click()">📸 Escanear Remito con IA</button>
    
    <div class="product-group">
        <h3>Jamón y Queso (Prioridad N1)</h3>
        <div class="item-row">
            <span class="item-name">Jamón y Queso (JQ)</span>
            <div class="inputs"><input type="number" id="st-JQ" placeholder="Hay"><input type="number" id="pe-JQ" placeholder="Llegan"></div>
        </div>
    </div>
    
    <div class="product-group"><h3>Carnes y Clásicas (N2 y N3)</h3><div id="clasicas-list"></div></div>
    
    <div class="product-group" style="background:#e3f2fd; padding:10px; border-radius:8px;">
        <h3 style="background:#1976d2;">Congelador: Lado Izquierdo</h3>
        <div id="cong-izq-list"></div>
    </div>
    <div class="product-group" style="background:#e3f2fd; padding:10px; border-radius:8px;">
        <h3 style="background:#1976d2;">Congelador: Lado Derecha</h3>
        <div id="cong-der-list"></div>
    </div>

    <button onclick="calcularDistribucion()">Calcular Distribución</button>

    <button class="btn-config" onclick="borrarLlave()">⚙️ Cambiar o borrar API Key de Gemini</button>
</div>

<div class="container grid-container" id="output-section">
    <div><div class="nevera-title">Nevera 1 (Max 11)</div><div class="nevera" id="nevera1"></div></div>
    <div><div class="nevera-title">Nevera 2 (Max 18)</div><div class="nevera" id="nevera2"></div></div>
    
    <div style="grid-column: span 2;">
        <div class="nevera-title">Nevera 3 (Max 20)</div>
        <div class="nevera" id="nevera3" style="height: auto; min-height: 200px;"></div>
    </div>
    
    <div style="grid-column: span 2; background: rgba(33, 150, 243, 0.1); padding: 5px; border-radius: 8px;">
        <div class="nevera-title" style="color: #0d47a1;">Congelador (Izquierda 12 | Derecha 12)</div>
        <div style="display: flex; gap: 10px;">
            <div class="nevera" id="cong-izq" style="flex: 1; height: 350px;"></div>
            <div class="nevera" id="cong-der" style="flex: 1; height: 350px;"></div>
        </div>
    </div>
    
    <button class="btn-secundario" onclick="location.reload()" style="grid-column: span 2;">Nuevo Cálculo</button>
</div>

<script>
    // --- 1. CONFIGURACIÓN DE LISTAS ---
    const clasicas = ['Bondiola', 'Capresse', 'Carne Cuchillo', 'Carne Picante', 'Carne Suave', 'Cheeseburger', 'Humita', 'Pollo', 'Roquefort c/ Jamón'];
    const congIzqArr = ['Choclo y Calabaza', 'Carne Criolla Veg.', 'Pollo Curry Veg.', 'Puerro y Hongos'];
    const congDerArr = ['Verdura', 'Cebolla y Queso', 'Burrito Ternera', 'Burrito Cerdo', 'Burrito Pollo', 'Burrito Veg.'];

    function generarInputs(array, containerId, prefix) {
        const container = document.getElementById(containerId);
        array.forEach((item, index) => {
            container.innerHTML += `
                <div class="item-row">
                    <span class="item-name">${item}</span>
                    <div class="inputs">
                        <input type="number" id="st-${prefix}${index}" placeholder="Hay">
                        <input type="number" id="pe-${prefix}${index}" placeholder="Llegan">
                    </div>
                </div>`;
        });
    }

    generarInputs(clasicas, 'clasicas-list', 'cl');
    generarInputs(congIzqArr, 'cong-izq-list', 'ci');
    generarInputs(congDerArr, 'cong-der-list', 'cd');

    // --- 2. INTEGRACIÓN CON GEMINI IA ---
    async function procesarRemitoIA() {
        let apiKey = localStorage.getItem('geminiApiKey');
        
        // Si no hay llave guardada, la pedimos mediante un cuadro de diálogo
        if (!apiKey) {
            apiKey = prompt("Por favor, ingresa tu API Key de Gemini. Solo se pedirá esta vez:");
            if (!apiKey) return; // Si el usuario cancela, no hacemos nada
            localStorage.setItem('geminiApiKey', apiKey);
        }

        const fileInput = document.getElementById('fotoRemitoIA');
        if (fileInput.files.length === 0) return;

        const btn = document.getElementById('btn-ia');
        const originalText = btn.innerHTML;
        btn.innerHTML = "⏳ La IA está leyendo y calculando...";
        btn.disabled = true;

        const file = fileInput.files[0];
        const reader = new FileReader();
        
        reader.onloadend = async function() {
            const base64Image = reader.result.split(',')[1];

            // Orden estricta para que devuelva formato de código (JSON)
            const promptText = `Analiza este remito. Calcula la cantidad de cajones dividiendo las empanadas entre 30 y los burritos entre 14. Devuelve ÚNICAMENTE un objeto JSON válido donde las claves sean el nombre del producto en MAYÚSCULAS y los valores sean los números finales. Ejemplo: {"JAMON Y QUESO": 5, "BONDIOLA": 2.5}. No incluyas texto adicional ni formato markdown.`;

            const payload = {
                contents: [{
                    parts: [
                        { text: promptText },
                        { inline_data: { mime_type: file.type, data: base64Image } }
                    ]
                }]
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                
                if (response.ok && data.candidates) {
                    let textoIA = data.candidates[0].content.parts[0].text;
                    // Limpiamos el texto por si la IA añade comillas de código
                    textoIA = textoIA.replace(/```json/g, '').replace(/```/g, '').trim();
                    
                    try {
                        const datosJSON = JSON.parse(textoIA);
                        inyectarDatos(datosJSON);
                        btn.innerHTML = "✅ ¡Datos Inyectados!";
                        btn.style.backgroundColor = "#28a745";
                    } catch (e) {
                        alert("Error al interpretar los datos de la IA. Intenta tomar la foto más cerca.");
                        btn.innerHTML = originalText;
                    }
                } else {
                    if(data.error && data.error.code === 400) {
                        alert("API Key inválida. Bórrala desde el botón de abajo e intenta de nuevo.");
                    } else {
                        alert("Error de la IA: " + (data.error ? data.error.message : "Desconocido"));
                    }
                    btn.innerHTML = originalText;
                }
            } catch (error) {
                alert("Error de conexión. Verifica tu internet.");
                btn.innerHTML = originalText;
            }
            
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.style.backgroundColor = "#007bff";
            }, 3000);
        }
        reader.readAsDataURL(file);
    }

    // --- 3. REPARTO AUTOMÁTICO EN CASILLAS ---
    function inyectarDatos(datos) {
        // Limpiamos todas las casillas de "Llegan" primero
        document.querySelectorAll('input[id^="pe-"]').forEach(input => input.value = "");

        for (const [producto, cantidad] of Object.entries(datos)) {
            let cant = Math.ceil(parseFloat(cantidad));
            if(cant <= 0) continue;

            let idDestino = null;
            let p = producto.toUpperCase();

            // Lógica de clasificación
            if (p.includes("JAMON") && p.includes("QUESO") && !p.includes("ROQUEFORT")) idDestino = "pe-JQ";
            else if (p.includes("BONDIOLA")) idDestino = "pe-cl0";
            else if (p.includes("CAPRESSE")) idDestino = "pe-cl1";
            else if (p.includes("CUCHILLO")) idDestino = "pe-cl2";
            else if (p.includes("PICANTE")) idDestino = "pe-cl3";
            else if (p.includes("SUAVE")) idDestino = "pe-cl4";
            else if (p.includes("CHEESEBURGER")) idDestino = "pe-cl5";
            else if (p.includes("HUMITA")) idDestino = "pe-cl6";
            else if (p.includes("POLLO") && !p.includes("CURRY") && !p.includes("BURRITO")) idDestino = "pe-cl7";
            else if (p.includes("ROQUEFORT")) idDestino = "pe-cl8";
            
            else if (p.includes("CHOCLO") || p.includes("CALABAZA")) idDestino = "pe-ci0";
            else if (p.includes("CRIOLLA")) idDestino = "pe-ci1";
            else if (p.includes("CURRY")) idDestino = "pe-ci2";
            else if (p.includes("PUERRO") || p.includes("HONGOS")) idDestino = "pe-ci3";
            
            else if (p.includes("VERDURA") && !p.includes("BURRITO")) idDestino = "pe-cd0";
            else if (p.includes("CEBOLLA") && !p.includes("BURRITO")) idDestino = "pe-cd1";
            else if (p.includes("BURRITO") && p.includes("TERNERA")) idDestino = "pe-cd2";
            else if (p.includes("BURRITO") && p.includes("CERDO")) idDestino = "pe-cd3";
            else if (p.includes("BURRITO") && p.includes("POLLO")) idDestino = "pe-cd4";
            else if (p.includes("BURRITO") && p.includes("VEG")) idDestino = "pe-cd5";

            if (idDestino) {
                // Sumamos por si la IA separó el mismo producto en dos líneas
                let actual = parseInt(document.getElementById(idDestino).value) || 0;
                document.getElementById(idDestino).value = actual + cant;
            }
        }
    }

    function borrarLlave() {
        localStorage.removeItem('geminiApiKey');
        alert("Llave borrada. La próxima vez que escanees un remito, se te pedirá ingresar tu API Key nuevamente.");
    }

    // --- 4. LÓGICA DE DISTRIBUCIÓN FÍSICA (Tu regla de forrado) ---
    function getVal(id) { return (parseInt(document.getElementById(id).value) || 0); }

    function calcularDistribucion() {
        document.getElementById('input-section').style.display = 'none';
        document.getElementById('output-section').style.display = 'grid';

        let maxIzq = 12, maxDer = 12;
        let cIzq = [], cDer = [];
        let poolN2N3 = [];

        // Regla Forrado Congelador Izquierdo
        congIzqArr.forEach((item, i) => {
            let hay = getVal(`st-ci${i}`);
            let llegan = getVal(`pe-ci${i}`);
            for(let j=0; j<hay; j++) { if(maxIzq > 0) { cIzq.push(`<div class="cajon delicado">${item}</div>`); maxIzq--; } }
            if(llegan > 0) poolN2N3.push({ name: `${item} (A Forrar)`, qty: llegan, isJQ: false, canFreeze: false, isForrar: true });
        });

        // Regla Forrado Congelador Derecho
        congDerArr.forEach((item, i) => {
            let hay = getVal(`st-cd${i}`);
            let llegan = getVal(`pe-cd${i}`);
            if(item.includes('Burrito')) {
                let total = hay + llegan;
                for(let j=0; j<total; j++) { if(maxDer > 0) { cDer.push(`<div class="cajon delicado">${item}</div>`); maxDer--; } }
            } else {
                for(let j=0; j<hay; j++) { if(maxDer > 0) { cDer.push(`<div class="cajon delicado">${item}</div>`); maxDer--; } }
                if(llegan > 0) poolN2N3.push({ name: `${item} (A Forrar)`, qty: llegan, isJQ: false, canFreeze: false, isForrar: true });
            }
        });

        let totalJQ = getVal('st-JQ') + getVal('pe-JQ');
        let maxN1 = 11;
        let jqParaN1 = Math.min(totalJQ, maxN1);
        let jqExcedente = totalJQ > maxN1 ? totalJQ - maxN1 : 0;
        
        while(jqExcedente > 0 && (maxIzq > 0 || maxDer > 0)) {
            if (maxIzq > 0) { cIzq.push(`<div class="cajon jq">Jamón y Queso (Exc)</div>`); maxIzq--; }
            else if (maxDer > 0) { cDer.push(`<div class="cajon jq">Jamón y Queso (Exc)</div>`); maxDer--; }
            jqExcedente--;
        }
        if (jqExcedente > 0) poolN2N3.push({ name: 'Jamón y Queso', qty: jqExcedente, isJQ: true, canFreeze: true, isForrar: false });

        clasicas.forEach((item, i) => {
            let total = getVal(`st-cl${i}`) + getVal(`pe-cl${i}`);
            if(total > 0) {
                let paraNevera = total;
                if (total > 6) {
                    let exceso = total - 6;
                    let congeladosExitosos = 0;
                    while(exceso > 0 && (maxIzq > 0 || maxDer > 0)) {
                        if (maxIzq > 0) { cIzq.push(`<div class="cajon excedente">${item} (Exc)</div>`); maxIzq--; }
                        else if (maxDer > 0) { cDer.push(`<div class="cajon excedente">${item} (Exc)</div>`); maxDer--; }
                        exceso--; congeladosExitosos++;
                    }
                    paraNevera = total - congeladosExitosos; 
                }
                poolN2N3.push({ name: item, qty: paraNevera, isJQ: false, canFreeze: true, isForrar: false });
            }
        });

        poolN2N3.sort((a, b) => b.qty - a.qty);
        let totalEnN2N3 = poolN2N3.reduce((acc, item) => acc + item.qty, 0);
        let excedenteGeneral = totalEnN2N3 - 38;
        
        if (excedenteGeneral > 0) {
            for (let item of poolN2N3) {
                if (excedenteGeneral <= 0 || (maxIzq + maxDer) <= 0) break;
                if (item.canFreeze === false) continue; // Protección a forrar
                let aCongelar = Math.min(item.qty - 2, excedenteGeneral, (maxIzq + maxDer));
                if (aCongelar > 0) {
                    item.qty -= aCongelar; excedenteGeneral -= aCongelar;
                    for(let i=0; i<aCongelar; i++) {
                        if (maxIzq > 0) { cIzq.push(`<div class="cajon excedente">${item.name} (Exc)</div>`); maxIzq--; }
                        else if (maxDer > 0) { cDer.push(`<div class="cajon excedente">${item.name} (Exc)</div>`); maxDer--; }
                    }
                }
            }
        }

        let cN1 = [];
        for(let i=0; i<jqParaN1; i++) { cN1.push(`<div class="cajon jq">Jamón y Queso</div>`); }

        let maxN2 = 18, maxN3 = 20;
        let cN2 = [], cN3 = [];
        let countN2 = 0, countN3 = 0;
        
        poolN2N3 = poolN2N3.filter(i => i.qty > 0).sort((a, b) => b.qty - a.qty);
        let totalPoolFinal = poolN2N3.reduce((acc, item) => acc + item.qty, 0);
        let permiteEspacios = (totalPoolFinal + poolN2N3.length) <= (maxN2 + maxN3);

        poolN2N3.forEach(item => {
            let remainingToPlace = item.qty;
            while (remainingToPlace > 0) {
                let chooseN2 = false;
                if (countN2 < maxN2 && countN3 < maxN3) chooseN2 = countN2 <= countN3; 
                else if (countN2 < maxN2) chooseN2 = true;
                else if (countN3 < maxN3) chooseN2 = false;
                else break;

                let arrayDestino = chooseN2 ? cN2 : cN3;
                let espacioDisponible = chooseN2 ? (maxN2 - countN2) : (maxN3 - countN3);
                let cantidadAColocar = Math.min(remainingToPlace, espacioDisponible);
                
                for(let i=0; i<cantidadAColocar; i++) {
                    let clase = "cajon";
                    if (item.isJQ) clase = "cajon jq";
                    if (item.isForrar) clase = "cajon forrar";
                    arrayDestino.push(`<div class="${clase}">${item.name}</div>`);
                    if (chooseN2) countN2++; else countN3++;
                }
                
                remainingToPlace -= cantidadAColocar;
                
                if (remainingToPlace === 0 && permiteEspacios) {
                    if (chooseN2 && countN2 < maxN2) { arrayDestino.push(`<div class="cajon espacio">--- Espacio Libre ---</div>`); countN2++; }
                    else if (!chooseN2 && countN3 < maxN3) { arrayDestino.push(`<div class="cajon espacio">--- Espacio Libre ---</div>`); countN3++; }
                }
            }
        });

        document.getElementById('cong-izq').innerHTML = cIzq.join('');
        document.getElementById('cong-der').innerHTML = cDer.join('');
        document.getElementById('nevera1').innerHTML = cN1.join('');
        document.getElementById('nevera2').innerHTML = cN2.join('');
        document.getElementById('nevera3').innerHTML = cN3.join('');
    }
</script>
</body>
</html>
